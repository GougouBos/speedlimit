<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Speed Limit</title>

<!-- iPhone "Add to Home Screen" settings -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Speed Limit">
<meta name="theme-color" content="#0b0b0c">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">

<style>
/* ============================================================
   LOOK & FEEL — change these to customise the app
   ============================================================ */
:root {
  --bg: #0b0b0c;              /* screen background */
  --text: #f2f2f2;            /* main text */
  --muted: #8a8a8f;           /* small grey text */
  --sign-fill: #ffffff;       /* inside of the speed-limit sign */
  --sign-ring: #d0021b;       /* red ring of the sign */
  --sign-text: #111111;       /* number on the sign */
  --sign-size: min(72vw, 58vh);
  --alert-bg: #6b000c;        /* background when you drive too fast */
  --font: -apple-system, "SF Pro Display", system-ui, "Segoe UI", Roboto, sans-serif;
}
/* ============================================================ */

* { box-sizing: border-box; margin: 0; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
  transition: background-color .25s;
}
body.over { animation: flash 1s steps(1) infinite; }
@keyframes flash { 50% { background: var(--alert-bg); } }

main {
  height: 100%;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 4vh;
}

.sign {
  width: var(--sign-size); height: var(--sign-size);
  border-radius: 50%;
  background: var(--sign-fill);
  border: calc(var(--sign-size) * .11) solid var(--sign-ring);
  display: grid; place-items: center;
  position: relative;
  transition: opacity .3s;
}
.sign .num {
  color: var(--sign-text);
  font-weight: 800;
  font-size: calc(var(--sign-size) * .40);
  letter-spacing: -.04em;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.sign.three .num { font-size: calc(var(--sign-size) * .31); }
.sign.unknown { opacity: .35; }
.sign .est {
  position: absolute; bottom: 14%;
  font-size: calc(var(--sign-size) * .07);
  color: var(--muted); font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
}

.info { text-align: center; }
.speed { font-size: 11vmin; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.speed small { font-size: .4em; color: var(--muted); font-weight: 500; margin-left: .2em; }
.road { margin-top: 1.2vh; font-size: 4.5vmin; color: var(--muted); max-width: 90vw;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status { margin-top: .8vh; font-size: 3.2vmin; color: var(--muted); min-height: 1.2em; }

.credit { position: fixed; bottom: calc(env(safe-area-inset-bottom) + 6px); right: 10px;
          font-size: 10px; color: var(--muted); opacity: .6; }

/* Phone on its side: sign left, text right */
@media (orientation: landscape) {
  main { flex-direction: row; gap: 8vw; }
  :root { --sign-size: min(75vh, 45vw); }
  .info { text-align: left; }
}

/* Start screen */
#start {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
  padding: 24px; text-align: center; z-index: 10;
}
#start h1 { font-size: 28px; }
#start p { color: var(--muted); max-width: 320px; line-height: 1.4; }
#start button {
  font: inherit; font-size: 22px; font-weight: 700;
  padding: 18px 56px; border-radius: 999px; border: 0;
  background: var(--sign-ring); color: #fff;
}
#start button:active { transform: scale(.97); }

/* Floating-window (picture-in-picture) button */
#pip {
  position: fixed; top: calc(env(safe-area-inset-top) + 12px); right: calc(env(safe-area-inset-right) + 12px);
  font: inherit; font-size: 15px; font-weight: 600;
  padding: 10px 16px; border-radius: 999px; border: 1px solid #333;
  background: #1c1c1e; color: var(--text);
}
/* The floating window is a video of this hidden drawing. iPhone won't play a video
   that isn't on screen, so it sits in a corner, 2 px wide and almost invisible. */
#pipVideo { position: fixed; left: 0; bottom: 0; width: 2px; height: 2px; opacity: .01; pointer-events: none; }
</style>
</head>
<body>

<div id="start">
  <h1>Speed Limit</h1>
  <p>Shows the speed limit of the road you're on, from OpenStreetMap. Mount your phone, then tap Start and allow location access.</p>
  <button id="go">Start</button>
</div>

<main>
  <div class="sign unknown" id="sign"><span class="num" id="limit">–</span><span class="est" id="est" hidden>est.</span></div>
  <div class="info">
    <div class="speed"><span id="speed">0</span><small>km/h</small></div>
    <div class="road" id="road">&nbsp;</div>
    <div class="status" id="status"></div>
  </div>
</main>
<div class="credit">© OpenStreetMap contributors</div>
<button id="pip" hidden>Pop out ⧉</button>
<video id="pipVideo" muted playsinline autoplay></video>

<script>
/* ============================================================
   BEHAVIOUR — safe to tweak
   ============================================================ */
const CONFIG = {
  tolerance: 3,          // km/h over the limit before the screen starts flashing
  fetchRadius: 600,      // metres of roads downloaded around you at once
  refetchDistance: 350,  // download again after driving this far from the last download
  maxRoadDistance: 30,   // ignore roads farther than this many metres from you
  // Used only when a road has no speed limit in OpenStreetMap:
  estimates: { motorway: 120, living_street: 20 },
};
/* ============================================================ */

const OVERPASS = [
  'https://overpass-api.de/api/interpreter',
  'https://overpass.private.coffee/api/interpreter',
  'https://maps.mail.ru/osm/tools/overpass/api/interpreter',
];
const ROAD_TYPES = 'motorway|trunk|primary|secondary|tertiary|unclassified|residential|living_street|service|road|' +
                   'motorway_link|trunk_link|primary_link|secondary_link|tertiary_link';

// OpenStreetMap "implicit" limits, e.g. maxspeed=BE-VLG:rural
const IMPLICIT = {
  'BE:urban': 50, 'BE-VLG:urban': 50, 'BE-WAL:urban': 50, 'BE-BRU:urban': 30,
  'BE-VLG:rural': 70, 'BE-WAL:rural': 90, 'BE-BRU:rural': 70,
  'BE:motorway': 120, 'BE:living_street': 20, 'BE:cyclestreet': 30,
  'NL:urban': 50, 'NL:rural': 80, 'NL:motorway': 100,
  'FR:urban': 50, 'FR:rural': 80, 'FR:motorway': 130,
  'DE:urban': 50, 'DE:rural': 100,
};

const $ = id => document.getElementById(id);
let roads = [];            // [{ id, tags, pts: [[lat, lon], ...] }]
let fetchCentre = null;    // [lat, lon] of last download
let fetching = false, retryAt = 0;
let lastPos = null, lastHeading = null, currentRoadId = null;

/* ---------- speed-limit text → number ---------- */
function parseSpeed(raw) {
  if (!raw) return null;
  const s = String(raw).split(';')[0].trim();
  let m;
  if ((m = s.match(/^(\d+)$/))) return { value: +m[1] };
  if ((m = s.match(/^(\d+)\s*mph$/i))) return { value: Math.round(m[1] * 1.609) };
  if (s === 'none') return { value: Infinity };
  if (s === 'walk') return { value: 6 };
  if ((m = s.match(/zone:?(\d+)$/i))) return { value: +m[1] };
  if (IMPLICIT[s]) return { value: IMPLICIT[s] };
  if (/:urban$/.test(s)) return { value: 50 };
  if (/:living_street$/.test(s)) return { value: 20 };
  return null;
}

function limitFor(tags, reverse) {
  const dirKey = reverse ? 'maxspeed:backward' : 'maxspeed:forward';
  for (const key of [dirKey, 'maxspeed', 'maxspeed:type', 'zone:maxspeed', 'source:maxspeed']) {
    const v = parseSpeed(tags[key]);
    if (v) return v;
  }
  const guess = CONFIG.estimates[tags.highway];
  return guess ? { value: guess, estimated: true } : null;
}

/* ---------- download roads around a point ---------- */
async function loadRoads(lat, lon) {
  fetching = true;
  setStatus(roads.length ? '' : 'Loading roads…');
  const query = `[out:json][timeout:20];way(around:${CONFIG.fetchRadius},${lat},${lon})["highway"~"^(${ROAD_TYPES})$"];out tags geom;`;
  // Ask the first server; if it hasn't answered after 4 s, also ask the next one. First answer wins.
  const stop = new AbortController();
  const ask = (url, i) => new Promise(r => setTimeout(r, i * 4000)).then(async () => {
    if (stop.signal.aborted) throw new Error('done');
    const res = await fetch(url, { method: 'POST', body: 'data=' + encodeURIComponent(query),
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      signal: AbortSignal.any([stop.signal, AbortSignal.timeout(25000)]) });
    if (!res.ok) throw new Error(res.status);
    return res.json();
  });
  try {
    const json = await Promise.any(OVERPASS.map(ask));
    stop.abort();
    roads = json.elements.filter(e => e.geometry).map(e => ({
      id: e.id, tags: e.tags || {}, pts: e.geometry.map(g => [g.lat, g.lon]),
    }));
    fetchCentre = [lat, lon];
    fetching = false;
    setStatus('');
    if (lastPos) update(lastPos);
  } catch (err) {
    fetching = false;
    retryAt = Date.now() + 5000;
    setStatus('No connection to map data – retrying…');
  }
}

/* ---------- find the road you are on ---------- */
function angleDiff(a, b) { const d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; }

function matchRoad(lat, lon, heading) {
  const kx = Math.cos(lat * Math.PI / 180) * 111320, ky = 110574;
  let best = null;
  for (const r of roads) {
    const p = r.pts;
    for (let i = 0; i < p.length - 1; i++) {
      const ax = (p[i][1] - lon) * kx,     ay = (p[i][0] - lat) * ky;
      const bx = (p[i + 1][1] - lon) * kx, by = (p[i + 1][0] - lat) * ky;
      const dx = bx - ax, dy = by - ay, len2 = dx * dx + dy * dy;
      const t = len2 ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / len2)) : 0;
      const dist = Math.hypot(ax + t * dx, ay + t * dy);
      if (dist > CONFIG.maxRoadDistance + 20) continue;

      let score = dist, reverse = false;
      if (heading != null) {
        const segBearing = (Math.atan2(dx, dy) * 180 / Math.PI + 360) % 360;
        const diff = angleDiff(heading, segBearing);
        reverse = diff > 90;
        const offAxis = Math.min(diff, 180 - diff);     // 0 = driving along the road
        score += offAxis > 45 ? 30 : offAxis / 3;
      }
      if (r.tags.highway === 'service') score += 8;     // prefer main roads over parking lanes
      if (r.id === currentRoadId) score -= 6;           // don't flicker at junctions
      if (!best || score < best.score) best = { road: r, dist, score, reverse };
    }
  }
  return best && best.dist <= CONFIG.maxRoadDistance ? best : null;
}

/* ---------- GPS updates ---------- */
function distance(a, b) {
  const kx = Math.cos(a[0] * Math.PI / 180) * 111320;
  return Math.hypot((a[1] - b[1]) * kx, (a[0] - b[0]) * 110574);
}

function onPosition(pos) {
  lastFix = Date.now();
  const c = pos.coords, here = [c.latitude, c.longitude];
  let heading = (c.heading != null && c.heading >= 0 && !isNaN(c.heading)) ? c.heading : null;
  let speed = (c.speed != null && c.speed >= 0) ? c.speed * 3.6 : null;

  if (lastPos) {  // work out heading / speed ourselves when the phone doesn't give them
    const moved = distance(lastPos.here, here), dt = (pos.timestamp - lastPos.time) / 1000;
    if (heading == null && moved > 4) {
      const kx = Math.cos(here[0] * Math.PI / 180);
      heading = (Math.atan2((here[1] - lastPos.here[1]) * kx, here[0] - lastPos.here[0]) * 180 / Math.PI + 360) % 360;
    }
    if (speed == null && dt > 0) speed = moved / dt * 3.6;
  }
  if (heading == null && (speed ?? 0) > 3) heading = lastHeading;
  if (heading != null) lastHeading = heading;

  lastPos = { here, time: pos.timestamp, heading, speed: speed ?? 0, accuracy: c.accuracy };
  update(lastPos);
}

function update(p) {
  const needRoads = !fetchCentre || distance(fetchCentre, p.here) > CONFIG.refetchDistance;
  if (needRoads && !fetching && Date.now() > retryAt) loadRoads(p.here[0], p.here[1]);

  const match = matchRoad(p.here[0], p.here[1], p.heading);
  currentRoadId = match ? match.road.id : null;
  const limit = match ? limitFor(match.road.tags, match.reverse) : null;
  render(limit, p.speed, match && match.road.tags, p.accuracy);
}

/* ---------- screen ---------- */
function render(limit, speed, tags, accuracy) {
  const sign = $('sign'), kmh = Math.round(speed);
  if (limit) {
    const txt = limit.value === Infinity ? '∞' : String(limit.value);
    $('limit').textContent = txt;
    sign.classList.toggle('three', txt.length >= 3);
    sign.classList.remove('unknown');
    $('est').hidden = !limit.estimated;
  } else {
    $('limit').textContent = tags ? '?' : '–';
    sign.classList.remove('three');
    sign.classList.add('unknown');
    $('est').hidden = true;
  }
  $('speed').textContent = kmh;
  $('road').textContent = tags ? (tags.name || tags.ref || tags.highway.replace('_', ' ')) : ' ';
  const over = !!limit && kmh > limit.value + CONFIG.tolerance;
  document.body.classList.toggle('over', over);
  view = { text: $('limit').textContent, unknown: !limit, estimated: !!limit?.estimated, kmh, over };
  drawPip();
  if (!fetching && Date.now() > retryAt) setStatus(accuracy > 50 ? `Weak GPS (±${Math.round(accuracy)} m)` : '');
}

function setStatus(t) { $('status').textContent = t; }

/* ---------- floating window (picture-in-picture) ----------
   iPhone can only float videos over other apps. So we draw the sign onto a
   hidden canvas and turn that drawing into a live video. */
const pipCanvas = document.createElement('canvas');
pipCanvas.width = 480; pipCanvas.height = 270;
const pctx = pipCanvas.getContext('2d');
const pipVideo = $('pipVideo');
let view = { text: '–', unknown: true, estimated: false, kmh: 0, over: false };
let lastFix = 0;

const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

function drawPip() {
  const W = pipCanvas.width, H = pipCanvas.height, now = Date.now();
  const stale = now - lastFix > 5000;               // no GPS for 5 s → don't trust the numbers
  const blink = Math.floor(now / 500) % 2 === 0;
  const font = cssVar('--font');

  pctx.fillStyle = cssVar(view.over && !stale && blink ? '--alert-bg' : '--bg');
  pctx.fillRect(0, 0, W, H);

  // Sign on the left
  const r = H * 0.42, cx = H / 2 + 10, cy = H / 2;
  pctx.globalAlpha = view.unknown || stale ? 0.35 : 1;
  pctx.fillStyle = cssVar('--sign-ring');
  pctx.beginPath(); pctx.arc(cx, cy, r, 0, Math.PI * 2); pctx.fill();
  pctx.fillStyle = cssVar('--sign-fill');
  pctx.beginPath(); pctx.arc(cx, cy, r * 0.78, 0, Math.PI * 2); pctx.fill();
  pctx.fillStyle = cssVar('--sign-text');
  pctx.textAlign = 'center'; pctx.textBaseline = 'middle';
  pctx.font = `800 ${Math.round(r * (view.text.length >= 3 ? 0.62 : 0.8))}px ${font}`;
  pctx.fillText(view.text, cx, cy + r * 0.04);
  if (view.estimated) {
    pctx.fillStyle = cssVar('--muted'); pctx.font = `600 ${Math.round(r * 0.14)}px ${font}`;
    pctx.fillText('EST.', cx, cy + r * 0.52);
  }
  pctx.globalAlpha = 1;

  // Your speed on the right
  const rx = H + (W - H) / 2;
  pctx.fillStyle = cssVar('--text'); pctx.font = `700 96px ${font}`;
  pctx.fillText(stale ? '–' : String(view.kmh), rx, cy - 12);
  pctx.fillStyle = cssVar('--muted'); pctx.font = `500 28px ${font}`;
  pctx.fillText(stale ? 'no GPS' : 'km/h', rx, cy + 52);

  // Blinking dot = the app is alive. If it stops blinking, the picture is frozen.
  if (blink) {
    pctx.fillStyle = stale ? '#8a8a8f' : '#30d158';
    pctx.beginPath(); pctx.arc(W - 20, 20, 7, 0, Math.PI * 2); pctx.fill();
  }
}

function setupPip() {
  if (!pipCanvas.captureStream) return;
  drawPip();
  pipVideo.srcObject = pipCanvas.captureStream(10);
  pipVideo.play().catch(() => {});
  setInterval(drawPip, 250);
  const canPip = document.pictureInPictureEnabled ||
                 pipVideo.webkitSupportsPresentationMode?.('picture-in-picture');
  $('pip').hidden = !canPip;
}

function togglePip() {
  try {
    if (pipVideo.paused) pipVideo.play().catch(() => {});
    if (typeof pipVideo.webkitSetPresentationMode === 'function') {   // Safari / iPhone
      const on = pipVideo.webkitPresentationMode === 'picture-in-picture';
      pipVideo.webkitSetPresentationMode(on ? 'inline' : 'picture-in-picture');
    } else if (document.pictureInPictureElement) {
      document.exitPictureInPicture();
    } else {
      pipVideo.requestPictureInPicture().catch(() => setStatus('Floating window not available'));
    }
  } catch (e) { setStatus('Floating window not available'); }
}
$('pip').addEventListener('click', togglePip);

/* ---------- keep the screen on ---------- */
let wakeLock = null;
async function keepAwake() {
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (e) { /* not supported */ }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && started) keepAwake();
});

/* ---------- start ---------- */
let started = false;
function start() {
  started = true;
  $('start').hidden = true;
  keepAwake();
  setupPip();
  setStatus('Waiting for GPS…');

  // Test mode: add ?sim=lat,lon,heading,speed to the URL to fake a position
  const sim = new URLSearchParams(location.search).get('sim');
  if (sim) {
    const [lat, lon, hdg = -1, kmh = 45] = sim.split(',').map(Number);
    const tick = () => onPosition({ timestamp: Date.now(),
      coords: { latitude: lat, longitude: lon, heading: hdg, speed: kmh / 3.6, accuracy: 5 } });
    tick(); setInterval(tick, 1000);
    return;
  }

  if (!('geolocation' in navigator)) return setStatus('This browser has no GPS access');
  navigator.geolocation.watchPosition(onPosition, err => {
    setStatus(err.code === 1 ? 'Location blocked – allow it in Settings › Safari › Location' : 'GPS unavailable…');
  }, { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 });
}
$('go').addEventListener('click', start);
</script>
</body>
</html>
